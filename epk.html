  <style>
    :root{
      --plum:#1b0f17; --plum-soft:#271620; --cream:#f3e9dc; --muted:#c9b3b8;
      --magenta:#c0356b; --gold:#e6d6a0; --line:#3a2530; --max:880px;
      --serif:"Playfair Display",Georgia,serif; --serif-body:"EB Garamond",Georgia,serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--plum);color:var(--cream);font-family:var(--serif-body);font-size:18px;line-height:1.65}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
    a{color:inherit}
    header.epk{padding:40px 28px 10px;text-align:center}
    .logo{font-family:var(--serif);font-weight:700;color:var(--magenta);font-size:clamp(48px,11vw,90px);line-height:1;letter-spacing:.03em}
    .kicker{font-family:var(--serif);font-style:italic;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-size:13px;margin-top:10px}
    .setups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:4px}
    @media(max-width:700px){.setups{grid-template-columns:1fr}}
    .setups>div{background:var(--plum-soft);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
    .setups .num{display:block;font-family:var(--serif);font-weight:700;color:var(--magenta);font-size:30px;line-height:1;margin-bottom:8px}
    .setups b{display:block;font-family:var(--serif);font-size:19px;margin-bottom:6px}
    .setups span.muted{display:block;font-size:16px;line-height:1.5}
    .updated-top{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:14px;margin-top:8px}
    .video{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--plum-soft)}
    .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .vcap{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:15px;margin:10px 0 0}
    .videos{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;margin-top:28px}
    @media(max-width:600px){.videos{grid-template-columns:1fr}}
    .listen{margin-top:8px;border-radius:12px;overflow:hidden}
    .listen iframe{display:block;width:100%;height:352px;border:0}
    .lang-switch{display:flex;gap:8px;justify-content:center;margin:22px 0 0}
    .lang-switch button{font-family:var(--serif);font-style:italic;letter-spacing:.08em;font-size:14px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:2px;padding:7px 16px;cursor:pointer;transition:all .2s}
    .lang-switch button.on{background:var(--gold);color:#2a2210;border-color:var(--gold)}
    section{padding:46px 0;border-top:1px solid var(--line)}
    section:first-of-type{border-top:none}
    .eyebrow{color:var(--gold);font-family:var(--serif);font-style:italic;letter-spacing:.18em;text-transform:uppercase;font-size:12px;margin-bottom:14px}
    h2{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4vw,34px);margin-bottom:18px}
    p{max-width:640px;margin-bottom:14px}
    .muted{color:var(--muted)}
    em{color:var(--magenta);font-style:italic}
    .quotes{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin-top:8px}
    .quote{background:var(--plum-soft);border:1px solid var(--line);border-radius:6px;padding:20px}
    .quote p{font-family:var(--serif);font-style:italic;font-size:18px;margin:0}
    .quote span{display:block;margin-top:10px;color:var(--gold);font-size:13px;font-family:var(--serif)}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:8px}
    @media(max-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
    .grid a{display:block;position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
    .grid img{width:100%;height:150px;object-fit:cover;display:block;transition:transform .3s}
    .grid a:hover img{transform:scale(1.05)}
    .dl{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
    .dl a{display:inline-block;padding:11px 20px;border:1px solid var(--muted);border-radius:2px;font-family:var(--serif);font-size:14px;letter-spacing:.04em;text-decoration:none}
    .dl a:hover{background:var(--gold);color:#2a2210;border-color:var(--gold)}
    .rows div{padding:10px 0;border-bottom:1px solid var(--line)}
    .rows b{color:var(--cream);font-family:var(--serif)}
    .contact a{color:var(--gold);text-decoration:none}
    .back{display:inline-block;margin:8px 0 0;color:var(--muted);font-family:var(--serif);font-style:italic;text-decoration:none}
    footer{padding:36px 0 60px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px}
    @media(max-width:600px){.quotes{grid-template-columns:1fr}}

    /* motion */
    html{scroll-behavior:auto}
    .reveal{opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity .8s cubic-bezier(.22,.61,.36,1),transform .8s cubic-bezier(.22,.61,.36,1),filter .8s ease}
    .reveal.in{opacity:1;transform:none;filter:none}
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;filter:none;transition:none}}
    .grid a{transition:transform .35s cubic-bezier(.22,.61,.36,1),box-shadow .35s ease}
    .grid a:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(192,53,107,.32)}
    .grid a:hover img{transform:scale(1.07)}
    .logo{transition:text-shadow .45s ease}
    header.epk .logo:hover{text-shadow:0 2px 34px rgba(192,53,107,.55)}
    .quote{transition:transform .3s ease,border-color .3s ease}
    .quote:hover{transform:translateY(-3px);border-color:var(--gold)}

    function setLang(l){
      document.documentElement.lang = l;
      document.querySelectorAll('[data-k]').forEach(function(el){ el.innerHTML = I[l][el.dataset.k] || ''; });
      document.querySelectorAll('.lang-switch button').forEach(function(b){ b.classList.toggle('on', b.dataset.l===l); });
      try{ localStorage.setItem('epklang', l); }catch(e){}
      try{ if(/^\/epk/.test(location.pathname)) history.replaceState(null, '', '/epk-' + l); }catch(e){}
    }
    document.querySelectorAll('.lang-switch button').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.l); }); });
    // /epk-nl, /epk-en, /epk-de pick the language; plain /epk falls back to the last choice, then NL
    var fromPath = (location.pathname.match(/epk-(nl|en|de)/) || [])[1];
    var saved = 'nl'; try{ saved = localStorage.getItem('epklang') || 'nl'; }catch(e){}
    setLang(fromPath || saved);

    // motion: cinematic staggered reveals + buttery smooth scroll
    (function(){
      var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold:0.12, rootMargin:'0px 0px -6% 0px' });
      document.querySelectorAll('section').forEach(function(sec){
        var items = Array.prototype.slice.call(sec.querySelectorAll('.eyebrow, h2, p, .quote, .rows > div, .setups > div, .grid a, .dl a'));
        items = items.filter(function(el){ return !items.some(function(o){ return o!==el && o.contains(el); }); });
        items.forEach(function(el,i){ el.classList.add('reveal'); el.style.transitionDelay = ((i%6)*0.06)+'s'; io.observe(el); });
      });
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!reduce && window.Lenis){
        var lenis = new Lenis({ duration:1.1, easing:function(t){ return Math.min(1, 1.001 - Math.pow(2, -10*t)); } });
        (function raf(t){ lenis.raf(t); requestAnimationFrame(raf); })();
      }
    })();
  </script>
